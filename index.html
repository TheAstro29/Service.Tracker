<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1b4332">
    <title>Service Tracker by C2TECH</title>

    <!-- โลโก้ / ไอคอนสำหรับ Add to Home Screen -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="C2TECH Service">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="C2TECH Service">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css" />

</head>

<body>

    <div class="sticky-wrapper">
        <div class="header-top">
            <div class="brand">
                <img src="icons/icon-512.png" alt="C2TECH" class="brand-logo">
                <h1>Service Tracker</h1>
            </div>
            <div class="header-actions">
                <i class="fas fa-user-circle admin-login-btn" id="userProfileIcon" onclick="openUserProfileOrLogin()" title="เข้าสู่ระบบ / โปรไฟล์"></i>
                <i class="fas fa-toolbox admin-login-btn" id="adminMenuIcon" onclick="openAdminMenu()" title="เมนู Admin" style="display:none;"></i>
                <i class="fas fa-lock admin-login-btn" id="lockIcon" onclick="adminAuth()" title="Admin Login"></i>
                <button class="btn-refresh" onclick="loadData()">
                    <i class="fas fa-sync-alt" id="refreshIcon"></i> รีเฟรช
                </button>
            </div>
        </div>

        <div class="filter-group">
            <div id="f-overdue" class="f-card" onclick="smartToggle('overdue')">
                <span id="cnt-overdue" class="val">0</span>
                <span class="lab"><i class="fas fa-circle-exclamation"></i> เลยกำหนด</span>
            </div>
            <div id="f-urgent" class="f-card" onclick="smartToggle('urgent')">
                <span id="cnt-urgent" class="val">0</span>
                <span class="lab"><i class="fas fa-clock"></i> ใกล้กำหนด</span>
            </div>
            <div id="f-all" class="f-card active-all" onclick="smartToggle('all')">
                <span id="cnt-all" class="val">0</span>
                <span class="lab"><i class="fas fa-layer-group"></i> ทั้งหมด</span>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search" style="color:var(--primary)"></i>
                <input type="text" id="mainSearch" placeholder="ค้นหาชื่อ, S/N, หรือจังหวัด..." onkeyup="debouncedRunFilters()">
            </div>
        </div>

        <div class="search-container" style="margin-top: 10px; display: flex; justify-content: center;">
            <div class="toolbar-row">

                <button class="btn-clear" onclick="clearAllFilters()">
                    <i class="fas fa-eraser"></i> ล้างการกรอง
                </button>

                <!-- ตัวกรอง Type (Lab / Real-time) -->
                <select id="typeFilter" class="chip-select" onchange="runFilters()">
                    <option value="all">Type ทั้งหมด</option>
                    <option value="Lab">Lab</option>
                    <option value="Real-time">Real-time</option>
                </select>

                <!-- ตัวกรอง Mode (Milled rice / Paddy) -->
                <select id="modeFilter" class="chip-select" onchange="runFilters()">
                    <option value="all">Mode ทั้งหมด</option>
                    <option value="Milled rice">Milled rice</option>
                    <option value="Paddy">Paddy</option>
                </select>

                <!-- ปุ่ม RENEW -->
                <div class="chip-switch">
                    <span class="chip-label">RENEW</span>
                    <label class="compact-switch">
                        <input type="checkbox" id="showRenewOnlySwitch" onchange="runFilters()">
                        <span class="compact-slider"></span>
                    </label>
                </div>

                <!-- ปุ่ม DONE -->
                <div class="chip-switch">
                    <span class="chip-label">DONE</span>
                    <label class="compact-switch">
                        <input type="checkbox" id="hideCompleteSwitch" onchange="render()">
                        <span class="compact-slider"></span>
                    </label>
                </div>

            </div>
        </div>
    </div>

    <div id="loading" class="loader-main" style="display: block;">
        <div class="loader-container">
            <div class="logo-loader">
                <div class="logo-ring"></div>
                <div class="logo-glow"></div>
                <img src="icons/icon-512.png" alt="C2TECH" class="logo-img">
            </div>
            <div class="loader-brand">C2TECH <span>SERVICE TRACKER</span></div>
            <div class="loader-text" id="loaderStatusText">กำลังเชื่อมต่อข้อมูลล่าสุด...</div>
            <div class="loader-bar-wrapper">
                <div class="loader-progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <main id="serviceList"></main>
    </div>

    <div id="printReportArea"></div>

    <script src="script.js"></script>
</body>

</html>
